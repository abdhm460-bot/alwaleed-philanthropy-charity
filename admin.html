<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>لوحة إدارة الطلبات</title>
  <style>
    body{font-family:Arial,sans-serif;max-width:1100px;margin:30px auto;padding:0 16px;background:#f6f7f9;color:#171717}
    .card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:18px;margin-bottom:16px}
    input,button{padding:10px;border-radius:8px;border:1px solid #bbb;font-size:15px}
    button{cursor:pointer;background:#111;color:#fff}.row{display:flex;gap:8px;flex-wrap:wrap}.muted{color:#666}
    table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #eee;text-align:right}
    img{max-width:420px;max-height:420px;object-fit:contain;border:1px solid #ddd;border-radius:8px;margin:8px}
    pre{white-space:pre-wrap;background:#f1f1f1;padding:12px;border-radius:8px}
  </style>
</head>
<body>
  <h1>لوحة إدارة الطلبات</h1>
  <div class="card">
    <div class="muted">هذه الصفحة مخصصة للمشرف فقط. لا تشارك كلمة المرور.</div>
    <div class="row" style="margin-top:12px">
      <input id="password" type="password" placeholder="كلمة مرور الإدارة" autocomplete="current-password">
      <button id="load">عرض الطلبات</button>
    </div>
    <p id="message"></p>
  </div>
  <div id="list" class="card" hidden></div>
  <div id="details" class="card" hidden></div>
<script>
let adminPassword='';
const $=id=>document.getElementById(id);
function showMessage(text){$('message').textContent=text;}
async function api(url){
  const r=await fetch(url,{headers:{'x-admin-password':adminPassword},cache:'no-store'});
  const data=await r.json().catch(()=>({ok:false,error:'INVALID_RESPONSE'}));
  if(!r.ok) throw new Error(data.error||('HTTP '+r.status));
  return data;
}
async function loadList(){
  try{
    const data=await api('/api/admin-applications');
    $('list').hidden=false;
    $('list').innerHTML='<h2>الطلبات</h2>'+(data.applications.length?'<table><thead><tr><th>رقم المعاملة</th><th>الاسم</th><th>الحالة</th><th>آخر 4 من IBAN</th><th></th></tr></thead><tbody>'+data.applications.map(a=>`<tr><td>${escapeHtml(a.transaction_number)}</td><td>${escapeHtml(a.full_name)}</td><td>${escapeHtml(a.status)}</td><td>••••${escapeHtml(a.iban_last4||'')}</td><td><button onclick="showDetails('${a.id}')">عرض</button></td></tr>`).join('')+'</tbody></table>':'لا توجد طلبات');
    showMessage('تم تحميل الطلبات.');
  }catch(e){showMessage('خطأ: '+e.message);}
}
async function loadImage(url){
  const r=await fetch(url,{headers:{'x-admin-password':adminPassword},cache:'no-store'});
  if(!r.ok) throw new Error('IMAGE_HTTP_'+r.status);
  const blob=await r.blob();
  return URL.createObjectURL(blob);
}
async function showDetails(id){
  try{
    const data=await api('/api/admin-applications?id='+encodeURIComponent(id));
    const a=data.application;
    $('details').hidden=false;
    $('details').innerHTML='<h2>تفاصيل الطلب</h2><p><b>الاسم:</b> '+escapeHtml(a.full_name)+'</p><p><b>رقم المعاملة:</b> '+escapeHtml(a.transaction_number)+'</p><p><b>الهاتف:</b> '+escapeHtml(a.phone||'')+'</p><p><b>IBAN:</b> <code>'+escapeHtml(a.iban)+'</code></p><h3>صور الهوية</h3><div id="images">جارٍ تحميل الصور...</div>';
    $('details').scrollIntoView({behavior:'smooth'});

    const container=$('images');
    const results=await Promise.all(data.images.map(async i=>{
      if(!i.url) return `<p>لم يتم العثور على صورة ${escapeHtml(i.side)}</p>`;
      try{
        const objectUrl=await loadImage(i.url);
        return `<div><b>${escapeHtml(i.side)}</b><br><img src="${escapeAttr(objectUrl)}" alt="${escapeAttr(i.side)}"></div>`;
      }catch(e){
        return `<p>تعذر تحميل صورة ${escapeHtml(i.side)}.</p>`;
      }
    }));
    container.innerHTML=results.join('')||'<p>لا توجد صور.</p>';
  }catch(e){showMessage('خطأ: '+e.message);}
}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function escapeAttr(v){return escapeHtml(v);}
$('load').onclick=()=>{adminPassword=$('password').value;if(!adminPassword){showMessage('أدخل كلمة مرور الإدارة.');return;}loadList();};
</script>
</body>
</html>
